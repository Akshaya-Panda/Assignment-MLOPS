global:
  scrape_interval: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Every API replica, discovered through the headless service's DNS A records.
  - job_name: cardiorisk-api
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["cardiorisk-api-headless.cardiorisk.svc.cluster.local"]
        type: A
        port: 8000
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
