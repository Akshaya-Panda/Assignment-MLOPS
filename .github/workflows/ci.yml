# CI/CD pipeline: lint -> unit tests -> train (MLflow) -> build & smoke-test the API image.
# Each job uploads its logs/outputs as workflow artifacts; any failure stops the chain.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  MLFLOW_DISABLE_AGENT_HINT: "1"
  IMAGE: cardiorisk-api

defaults:
  run:
    shell: bash  # bash -eo pipefail: a failing command inside a pipe fails the step

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.17.0
      - name: Lint
        run: ruff check . --output-format=github
      - name: Formatting
        run: ruff format --check --diff .

  test:
    name: Unit tests (pytest)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Acquire and validate dataset (SHA-256 checked)
        run: python -m cardiorisk.data
      - name: Run tests with coverage
        run: |
          mkdir -p reports
          pytest --junitxml=reports/junit.xml \
                 --cov=cardiorisk --cov=app \
                 --cov-report=term-missing --cov-report=xml:reports/coverage.xml \
                 | tee reports/pytest.log
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            reports/junit.xml
            reports/coverage.xml
            reports/pytest.log

  train:
    name: Train & track (MLflow)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Train, tune and register models
        run: python -m cardiorisk.train 2>&1 | tee train.log
      - name: Summarise results in the run page
        run: |
          python - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import csv
          cols = ["model", "cv_roc_auc_mean", "cv_roc_auc_std", "test_roc_auc", "test_recall", "test_accuracy"]
          rows = list(csv.DictReader(open("reports/model_comparison.csv")))
          print("### Model comparison (5-fold CV + hold-out test)\n")
          print("| " + " | ".join(cols) + " |")
          print("|" + "---|" * len(cols))
          for r in rows:
              print("| " + " | ".join(r[c] for c in cols) + " |")
          EOF
      - name: Upload model, reports and MLflow store
        uses: actions/upload-artifact@v7
        with:
          name: model-and-reports
          path: |
            models/
            reports/
            mlflow.db
            mlruns/
            train.log
          retention-days: 14

  docker:
    name: Build & smoke-test image
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download trained model
        uses: actions/download-artifact@v8
        with:
          name: model-and-reports
          path: .
      - name: Build image
        run: docker build -t "$IMAGE:${GITHUB_SHA::7}" -t "$IMAGE:latest" . 2>&1 | tee docker-build.log
      - name: Run container
        run: docker run -d --name api -p 8000:8000 "$IMAGE:latest"
      - name: Smoke test (/health, /ready, /predict, 422 validation, /metrics)
        run: bash scripts/smoke_test.sh http://127.0.0.1:8000
      - name: Collect container logs
        if: always()
        run: |
          docker logs api > container.log 2>&1 || true
          docker inspect --format '{{.State.Health.Status}}' api || true
          docker rm -f api || true
      - name: Upload Docker logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-logs
          path: |
            docker-build.log
            container.log
