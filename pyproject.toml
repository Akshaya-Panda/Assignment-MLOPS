[project]
name = "cardiorisk"
version = "1.0.0"
description = "Heart disease risk classifier with an end-to-end MLOps pipeline"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["slow: end-to-end training run (~30 s); deselect with -m 'not slow'"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx` with `starlette"]
